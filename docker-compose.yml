services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: 4000
      JWT_SECRET: change-this-secret-before-deploy
      CORS_ORIGIN: http://localhost:5173
      DATA_STORE: ${DATA_STORE:-json}
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-gesture_control}
      JSON_DB_PATH: data/db.json
    ports:
      - "4000:4000"
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend-data:

